[project]
name = "agentos-backend"
version = "0.1.0"
description = "AgentOS — multi-agent AI platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "sse-starlette>=2.1",
    "structlog>=24.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "anthropic>=0.34",
    "httpx>=0.27",
    "langgraph>=0.2",
    "mcp>=1.2",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert in tests
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "ASYNC230", "ASYNC240"]
# conftest must set env vars before importing app modules.
"tests/conftest.py" = ["E402"]
"alembic/**" = ["I001"]
# Autogenerated migration files are not hand-formatted.
"alembic/versions/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL and Redis",
    "live_llm: requires a real LLM API key (opt-in: -m live_llm)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
